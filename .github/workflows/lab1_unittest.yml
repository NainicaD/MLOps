name: Lab 1 - Python Unittests

on:
  push:
    branches: [main]
    paths:
      - "Github Actions/Lab 1/**"
      - ".github/workflows/lab1_unittest.yml"
  pull_request:
    branches: [main]
    paths:
      - "Github Actions/Lab 1/**"
      - ".github/workflows/lab1_unittest.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Github Actions/Lab 1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unittests
        run: python -m unittest test.test_unittest -v
      - name: Notify on success
        if: success()
        run: echo "Unit tests passed successfully"
      - name: Notify on failure
        if: failure()
        run: echo "Unit tests failed"
