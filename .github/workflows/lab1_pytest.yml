name: Lab 1 - Testing with Pytest

on:
  push:
    branches: [main]
    paths:
      - "Github Actions/Lab 1/**"
      - ".github/workflows/lab1_pytest.yml"
  pull_request:
    branches: [main]
    paths:
      - "Github Actions/Lab 1/**"
      - ".github/workflows/lab1_pytest.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Github Actions/Lab 1"
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests and generate XML report
        run: pytest -v --junitxml=pytest-report.xml
        continue-on-error: false
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab1-test-results-py${{ matrix.python-version }}
          path: "Github Actions/Lab 1/pytest-report.xml"
      - name: Notify on success
        if: success()
        run: echo "Tests passed successfully on Python ${{ matrix.python-version }}"
      - name: Notify on failure
        if: failure()
        run: echo "Tests failed on Python ${{ matrix.python-version }}"
